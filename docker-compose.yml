services:
  core-keeper-ds-docker:
    build: .
    image: devidian/core-keeper-dedicated:latest
    container_name: core-keeper-ds-docker
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "17000:17000/tcp"
      - "17000:17000/udp"
      - "17001:17001/udp"
    environment:
      GAME_ID: ""
      DATA_PATH: /home/steam/core-keeper-data
      SERVER_NAME: Core Keeper Dedicated Docker Server
      WORLD_ID: "0"
      WORLD_SEED: "0"
      WORLD_MODE: Normal
      MAX_PLAYERS: "4"
      SERVER_PORT: "17000"
      WORLD_SIZE: "1"
      WORLD_NAME: Default Docker World
      SERVER_PUBLIC: "false"
      SERVER_PASSWORD: defaultPassword
      # Set only for a deliberate, backed-up activation on an existing world.
      # ACTIVATE_CONTENT_BUNDLES: BiomeStatues,LegendaryScepterDungeon,MossBiomeDungeons
      # ACTIVATE_ALL_CONTENT: "true"
    volumes:
      - /appdata/core-keeper/dedicated:/home/steam/core-keeper-dedicated
      - /appdata/core-keeper/data:/home/steam/core-keeper-data
